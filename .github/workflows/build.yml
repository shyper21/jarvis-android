name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version=8.2 --distribution-type=bin

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Get version from build.gradle
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Jarvis-v${{ steps.version.outputs.version }}.apk

      - name: Delete existing release if exists
        run: |
          gh release delete v${{ steps.version.outputs.version }} --yes || true
          git push --delete origin v${{ steps.version.outputs.version }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Jarvis v${{ steps.version.outputs.version }}"
          body: |
            ## Jarvis AI Assistant v${{ steps.version.outputs.version }}
            
            ### Download
            Tap **Jarvis-v${{ steps.version.outputs.version }}.apk** below to download and install.
            
            ### Whats new
            - Auto-update support
            - App launcher (YouTube, Camera, Maps, WhatsApp)
            - Mic toggle button
            - Offline detection
            - Splash screen
          files: app/build/outputs/apk/debug/Jarvis-v${{ steps.version.outputs.version }}.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
